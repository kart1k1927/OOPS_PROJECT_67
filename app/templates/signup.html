<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register · I-ITSM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ url_for('static', path='css/tokens.css') }}">
<link rel="stylesheet" href="{{ url_for('static', path='css/components.css') }}">
<link rel="stylesheet" href="{{ url_for('static', path='css/layout.css') }}">
</head>
<body>
<div class="gate">
  <div class="gate__card">
    <div class="gate__brand">I-ITSM</div>
    <div class="gate__sub">Create an employee account</div>

    {% if error %}
    <div class="notice notice--bad"><p class="t-small">{{ error }}</p></div>
    {% endif %}

    <form method="post" action="/signup">
      <label class="field">
        <span class="field__label">Full name</span>
        <input class="input" type="text" name="full_name" value="{{ full_name or '' }}" required autofocus autocomplete="name">
      </label>
      <label class="field">
        <span class="field__label">Email</span>
        <input class="input" type="email" name="email" value="{{ email or '' }}" required autocomplete="email">
        <span class="field__hint">Use your campus address.</span>
      </label>
      <label class="field">
        <span class="field__label">Password</span>
        <input class="input" type="password" name="password" required minlength="8" autocomplete="new-password">
        <span class="field__hint">At least 8 characters, mixing letters and numbers.</span>
      </label>
      <label class="field">
        <span class="field__label">Confirm password</span>
        <input class="input" type="password" name="confirm" required autocomplete="new-password">
      </label>
      <button class="btn btn--primary btn--lg btn--block" type="submit">Create account</button>
    </form>

    <p class="gate__alt">Already registered? <a href="/signin">Sign in</a>.</p>
  </div>
</div>
</body>
</html>
