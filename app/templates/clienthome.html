<html>
<head>
    <title>welcome</title>

    <link rel="stylesheet" type="text/css" href="BASE_DIR / "app" /"static" / "style.css">

    <!-- bootstrap -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    
</head>
<body>
    <h1> welcome back!</h1>
    <a href="#report"> report an incident</a>
    <br>
    <a href="#log"> review your previous reports</a>
    <br>

    <div id="report">
        <h2>report an incident</h2>
        <form action="#" method="post" id="form">
            <label for="type">type of incident</label>
            <br>
            <select id="type" name="type">
                <option>select</option>
                <option>Hardware</option>
                <option>Software</option>
                <option>Network</option>
                <option>Database</option>
                <option>Cloud</option>
                <option>Security</option>
                <option>Authentication</option>
                <option>Application</option>
                <option>Storage</option>
                <option>other</option>
            </select>
            <br><br>

            <label for="description">provide a description for the incident</label>   
            <br>
            <input type="text" id="description" name="description" required>
            <br><br>

            <label for="priority">whats the priority of the incident on a scale of 0-10</label>
            <br>
            <input type="number" id="priority" name="priority" min="0" max="10" required>
            <br><br>

            <label for="urgency">how urgent is the resolution of the incident on a scale of 0-10</label>
            <br>
            <input type="number" id="urgency" name="urgency" min="0" max="10" required>
            <br><br>

            <input type="hidden" id="submissionTime" name="submissionTime">
            <input type="submit" value="submit">

        </form>

        <script>
        
        const form = document.getElementById("form");


        form.addEventListener("submit", function() {
        document.getElementById("submissionTime").value = new Date().toLocaleString("sv-SE", {timeZone: "Asia/Kolkata" });
        });

        </script>

    </div>
    <br>

    <div id="log">
        <h2>review previous reports</h2>
        <form action="#" method="post" id="log">

            <label for="log">enter the incident id of required report</label>
            <br>
            <input type="text" id="log" name="log" required>
            <br><br>

            <input type="submit" value="submit">
    </div>

<script src="BASE_DIR / "app" /"static" / "js" / "clienthome.js"></script>
</body>
</html>
